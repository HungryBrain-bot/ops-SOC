name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q
      - name: SOAR test push (stub server)
        run: |
          python -m opssoc.soar write --target xsoar --report examples/case_report.json --mode test
          python -m opssoc.soar write --target secops --report examples/case_report.json --mode test
