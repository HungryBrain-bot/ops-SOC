name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q
      - name: SOAR test push (stub server)
        run: |
          python -m opssoc.soar write --target xsoar --report examples/case_report.json --mode test
          python -m opssoc.soar write --target secops --report examples/case_report.json --mode test

  replay-kusto:
    # The replay backend in the real Kusto emulator: fetch the pinned OTRF datasets,
    # map Sysmon to the Defender tables, load, and run the engine tests.
    needs: test
    runs-on: ubuntu-latest
    services:
      kusto:
        # Same image and digest as detection_As_Code. ACCEPT_EULA accepts Microsoft's
        # licence terms for the emulator, which is for development and test use.
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux@sha256:e65f37c78185cf88c2161e304572d5399553b98c5b606412ea7ee31c812b7fd4
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    env:
      OPSSOC_KUSTO_URL: http://localhost:8080
      OPSSOC_DAC_PATH: ${{ github.workspace }}/.dac
    steps:
      - uses: actions/checkout@v4
      - name: Check out detection_As_Code at the pinned commit (ADR 004)
        uses: actions/checkout@v4
        with:
          repository: HungryBrain-bot/detection_As_Code
          ref: 51080aa733242325215be64f75a83926c4ac35ef
          path: .dac
      - name: Pinned commit matches the code
        run: grep -q 'DAC_COMMIT = "51080aa733242325215be64f75a83926c4ac35ef"' opssoc/replay/dac_bridge.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,seed]"
      - name: Wait for the emulator
        run: |
          for i in $(seq 1 60); do
            if curl -sf -X POST http://localhost:8080/v1/rest/mgmt -H 'Content-Type: application/json' \
                 -d '{"csl":".show version"}' > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "Kusto emulator did not start" >&2; exit 1
      - name: Fetch OTRF datasets (pinned by SHA-256)
        run: python -m opssoc.replay fetch
      - name: Seed alerts (DaC rules per dataset) and load all datasets
        run: python -m opssoc.replay seed
      - name: Engine tests
        run: python -m pytest -q tests/test_replay_engine.py
      - name: Keep the seeded alerts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-alerts
          path: data/replay/alerts.json
          if-no-files-found: ignore
