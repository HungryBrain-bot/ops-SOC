[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-soc"
version = "0.1.0"
description = "SOC agents for Microsoft Defender and Sentinel with a SOAR writer"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Alert seeding imports detection_As_Code, which needs PyYAML (ADR 004).
seed = ["PyYAML>=6.0"]
# LLM providers (ADR 005). Tests use fakes and do not need these.
llm = ["anthropic>=2.13", "openai>=3.58"]

[tool.setuptools.packages.find]
include = ["opssoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
opssoc = ["replay/schemas/*.json", "replay/datasets.json", "agents/*/agent.md", "agents/investigation/factors.json",
          "eval/*.json", "intel/snapshots.json"]
